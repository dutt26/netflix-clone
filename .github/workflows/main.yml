name: Enterprise Static Website CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  IMAGE_NAME: dutt26/netflix
  IMAGE_TAG: ${{ github.sha }}
  REPO: netfliximage

jobs:
  build:
    name: Validate Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Display Versions
        run: |
          node --version
          npm --version

      - name: Install Validation Tools
        run: |
          npm install -g htmlhint
          npm install -g eslint@8
          npm install -g stylelint stylelint-config-standard

      - name: Create HTMLHint Config
        run: |
          cat > .htmlhintrc <<EOF
          {
            "tagname-lowercase": true,
            "attr-lowercase": true,
            "tag-pair": true
          }
          EOF

      - name: Create ESLint Config
        run: |
          cat > .eslintrc.json <<EOF
          {
            "env": {
              "browser": true,
              "es2021": true
            },
            "extends": "eslint:recommended",
            "parserOptions": {
              "ecmaVersion": 2021
            },
            "rules": {
              "no-unused-vars": "warn"
            }
          }
          EOF

      - name: Validate HTML
        run: htmlhint "*.html"

      - name: Lint CSS
        continue-on-error: true
        run: |
          stylelint "**/*.css" || true

      - name: Lint JavaScript
        continue-on-error: true
        run: |
          eslint login.js register.js script.js session.js || true

      - name: Upload Website Artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-files
          path: |
            *.html
            *.css
            *.js
            assets/

  security:
    name: Security & Docker Validation
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Website Artifact
        uses: actions/download-artifact@v4
        with:
          name: website-files
          path: .

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Lint Dockerfile
        continue-on-error: true
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Verify Docker Image
        run: |
          docker images
          docker image inspect ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Image
        run: |
          docker tag \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            ${{ secrets.DOCKER_USER }}/${{ env.REPO }}:${{ env.IMAGE_TAG }}

          docker push \
            ${{ secrets.DOCKER_USER }}/${{ env.REPO }}:${{ env.IMAGE_TAG }}

      - name: Smoke Test
        run: |
          docker run -d \
            --name netflix-test \
            -p 8080:80 \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          sleep 10

          docker ps
          docker logs netflix-test

      - name: Cleanup
        if: always()
        run: docker rm -f netflix-test || true
