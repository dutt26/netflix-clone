name: Enterprise Static Website CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  checks: write
  packages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  IMAGE_NAME: dutt26/netflix
  IMAGE_TAG: ${{ github.sha }}
  REPO: netfliximage

jobs:

  build:
    name: Validate Static Website
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Display Versions
        run: |
          node --version
          npm --version

      - name: Install Validation Tools
        run: |
          npm install -g htmlhint stylelint stylelint-config-standard eslint

      - name: Create HTMLHint Configuration
        run: |
          cat <<EOF > .htmlhintrc
          {
            "tagname-lowercase": true,
            "attr-lowercase": true,
            "attr-value-double-quotes": false,
            "doctype-first": false,
            "tag-pair": true,
            "id-unique": true
          }
          EOF

      - name: Create Stylelint Configuration
        run: |
          cat <<EOF > .stylelintrc.json
          {
            "extends": "stylelint-config-standard"
          }
          EOF

      - name: Create ESLint Configuration
        run: |
          cat <<EOF > eslint.config.js
          export default [
            {
              files: ["**/*.js"],
              languageOptions: {
                ecmaVersion: "latest",
                sourceType: "script"
              },
              rules: {
                "no-unused-vars": "warn",
                "no-undef": "off"
              }
            }
          ];
          EOF

      - name: Validate HTML
        run: |
          htmlhint "*.html"

      - name: Validate CSS Files
        run: |
          find . -name "*.css" -exec echo "Checking {}" \;

      - name: Lint JavaScript
        run: |
          eslint *.js

      - name: Upload Website Artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-files
          path: |
            *.html
            *.css
            *.js
            assets/**

  security:
    name: Security & Docker Validation
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      security-events: write

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Website Artifact
        uses: actions/download-artifact@v4
        with:
          name: website-files
          path: .

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.2

      - name: Run Trivy Filesystem Scan
        run: |
          trivy fs \
            --severity HIGH,CRITICAL \
            --format sarif \
            --output trivy-fs.sarif \
            --exit-code 1 \
            .

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore Docker Cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          provenance: false

          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest

          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new

          labels: |
            org.opencontainers.image.title=Netflix Clone
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Update Docker Cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Verify Docker Image
        run: |
          docker images
          docker image inspect ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Image
        run: |
          docker tag \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            ${{ secrets.DOCKER_USER }}/${{ env.REPO }}:${{ env.IMAGE_TAG }}

          docker push \
            ${{ secrets.DOCKER_USER }}/${{ env.REPO }}:${{ env.IMAGE_TAG }}

      - name: Smoke Test Container
        run: |
          docker run -d \
            --name netflix-test \
            -p 8080:80 \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          sleep 15

          docker ps
          docker logs netflix-test

      - name: Cleanup
        if: always()
        run: |
          docker rm -f netflix-test || true
