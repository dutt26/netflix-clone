name: Enterprise Java CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  checks: write
  packages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  IMAGE_NAME: dutt26/netflix
  IMAGE_TAG: ${{ github.sha }}
  REPO: netfliximage

jobs:

  build:
    name: Build Spring Boot Application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    steps:
      # Checkout Source
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Display Versions
      - name: Display Versions
        run: |
          java -version
          mvn -version

      # Restore Maven Cache
      - name: Restore Maven Cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Download Dependencies
      - name: Download Dependencies
        run: mvn dependency:go-offline

      # Verify Dependency Tree
      - name: Verify Dependencies
        run: mvn dependency:tree

      # Unit Tests
      - name: Run Unit Tests
        run: mvn clean test

      # Publish Test Report
      - name: Publish JUnit Test Report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: target/surefire-reports/*.xml
          fail_on_failure: true

      # Upload Test Reports
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-report
          path: target/surefire-reports/

      # Build Application
      - name: Build Spring Boot Application
        run: mvn clean package -DskipTests

      # Upload JAR Artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: springboot-artifact
          path: target/*.jar

  security:
    name: Security & Docker Validation
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      security-events: write

    steps:
      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Download JAR
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: springboot-artifact
          path: target

      # Gitleaks Secret Scan
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Install Trivy
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.2

      # Trivy Filesystem Scan
      - name: Run Trivy Filesystem Scan
        run: |
          trivy fs \
            --severity HIGH,CRITICAL \
            --format sarif \
            --output trivy-fs.sarif \
            --exit-code 1 \
            .

      # Upload SARIF Report
      - name: Upload Trivy SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif

      # Dockerfile Lint
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      # Setup Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Docker Cache
      - name: Restore Docker Cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # Build Docker Image
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          provenance: false

          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest

          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new

          labels: |
            org.opencontainers.image.title=Netflix Clone
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.revision=${{ github.sha }}

      # Update Docker Cache
      - name: Update Docker Cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # Verify Image
      - name: Verify Docker Image
        run: |
          docker images
          docker image inspect ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # Docker Login
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Push Image
      - name: Push Docker Image
        run: |
          docker tag \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            ${{ secrets.DOCKER_USER }}/${{ env.REPO }}:${{ env.IMAGE_TAG }}

          docker push \
            ${{ secrets.DOCKER_USER }}/${{ env.REPO }}:${{ env.IMAGE_TAG }}

      # Smoke Test
      - name: Smoke Test Container
        run: |
          docker run -d \
            --name netflix-test \
            -p 8080:8080 \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          sleep 30

          docker ps
          docker logs netflix-test

      # Cleanup
      - name: Cleanup
        if: always()
        run: |
          docker rm -f netflix-test || true
